name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Install Dependencies (Local)
      run: npm ci

    - name: Build (Local)
      run: npm run build

    - name: Compress Target Files
      run: tar -czf release.tar.gz dist package.json package-lock.json

    - name: Upload Release to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "release.tar.gz"
        target: "/home/api.rojgariindia.com/public_html/"
        overwrite: true

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          export NVM_DIR=~/.nvm
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use 20 || nvm install 20

          cd /home/api.rojgariindia.com/public_html
          tar -xzf release.tar.gz || true
          rm -f release.tar.gz

          npm install --omit=dev --no-audit --no-fund
          node run_migration.js

          # Forced clean restart to ensure .env is picked up from PWD
          pm2 delete rojgari-backend || true
          pm2 start dist/server.js --name rojgari-backend --cwd /home/api.rojgariindia.com/public_html
          pm2 save

          echo "✅ AdminBackend Deployment complete! Status check..."
          sleep 5
          pm2 list
          pm2 show rojgari-backend
          pm2 logs rojgari-backend --lines 50 --nostream || true
