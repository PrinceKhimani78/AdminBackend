name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install Dependencies (Local)
      run: npm ci

    - name: Build (Local)
      run: npm run build

    - name: Compress Target Files
      run: tar -czf release.tar.gz dist package.json package-lock.json

    - name: Upload Release to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "release.tar.gz"
        target: "/home/api.rojgariindia.com/public_html/"
        overwrite: true

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          set -x

          echo "🚀 Starting AdminBackend deployment..."

          # Load NVM properly (IMPORTANT FIX)
          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh" || true

          # Ensure Node is available
          nvm use 16 || nvm install 16
          node -v
          npm -v

          cd /home/api.rojgariindia.com/public_html

          # Ensure tar exists before extracting
          if [ ! -f release.tar.gz ]; then
            echo "❌ release.tar.gz not found!"
          fi

          tar -xzf release.tar.gz
          rm -f release.tar.gz

          npm install
          npm run db:migrate

          # Restart app safely
          pm2 delete rojgari-backend || true
          pm2 start dist/src/index.js --name rojgari-backend
          pm2 save

          echo "✅ AdminBackend Deployment complete!"
