name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'

    - name: Install Dependencies (Local)
      run: npm ci

    - name: Build (Local)
      run: npm run build

    - name: Compress Target Files
      run: tar -czf release.tar.gz dist package.json package-lock.json

    - name: Upload Release to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "release.tar.gz"
        target: "/home/api.rojgariindia.com/public_html/"
        overwrite: true

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          source ~/.bashrc || true
          source ~/.profile || true
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm alias default $(nvm ls | grep -o 'v[0-9]*\.[0-9]*\.[0-9]*' | tail -1) || true
          nvm use default || true
          cd /home/api.rojgariindia.com/public_html
          tar -xzf release.tar.gz || true
          rm -f release.tar.gz
          npm install --omit=dev --no-audit --no-fund
          node run_migration.js
          pm2 restart rojgari-backend || pm2 start dist/src/index.js --name rojgari-backend
          pm2 save
