name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Install Dependencies (Local)
      run: npm ci

    - name: Build (Local)
      run: npm run build

    - name: Compress Target Files
      run: tar -czf release.tar.gz dist package.json package-lock.json

    - name: Upload Release to Server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "release.tar.gz"
        target: "/home/api.rojgariindia.com/public_html/"
        overwrite: true

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          set -e
          echo "🚀 Starting AdminBackend deployment..."

          echo "📍 USER: $(whoami)"
          echo "📍 HOME: $HOME"
          echo "📍 PATH: $PATH"

          # Safe NVM loading (NO CRASH)
          export NVM_DIR="$HOME/.nvm"

          if [ -s "$NVM_DIR/nvm.sh" ]; then
            echo "✅ NVM found, loading..."
            source "$NVM_DIR/nvm.sh"
          else
            echo "⚠️ NVM not found, installing..."
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            source "$NVM_DIR/nvm.sh"
          fi

          # Ensure Node works
          nvm install 20
          nvm use 20

          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"

          cd /home/api.rojgariindia.com/public_html

          # Ensure tar exists before extracting
          if [ ! -f release.tar.gz ]; then
            echo "❌ release.tar.gz not found!"
            exit 1
          fi

          tar -xzf release.tar.gz
          rm -f release.tar.gz

          npm install --omit=dev --no-audit --no-fund

          # Run migration safely
          node run_migration.js

          # Restart app
          pm2 delete rojgari-backend || true
          pm2 start dist/server.js --name rojgari-backend
          pm2 save

          echo "✅ AdminBackend Deployment complete!"
