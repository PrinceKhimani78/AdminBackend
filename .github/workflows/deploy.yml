name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '20'

    - name: Install Dependencies (Local)
      run: npm ci

    - name: Build (Local)
      run: npm run build

    - name: Compress Target Files
      run: tar -czf release.tar.gz dist package.json package-lock.json run_migration.js

    - name: Upload Release to Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST || secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        source: "release.tar.gz"
        target: "/home/${{ secrets.SERVER_USER }}/api.rojgariindia.com/"
        overwrite: true

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST || secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /home/${{ secrets.SERVER_USER }}/api.rojgariindia.com/
          tar -xzf release.tar.gz || true
          rm -f release.tar.gz

          # Force cPanel Passenger/LiteSpeed to restart the Node app
          mkdir -p tmp
          touch tmp/restart.txt
          pkill -u ${{ secrets.SERVER_USER }} node || true

          echo "✅ AdminBackend Deployment complete!"

          echo "✅ AdminBackend Deployment complete! Status check..."
          sleep 5
          pm2 list
          pm2 show rojgari-backend
          pm2 logs rojgari-backend --lines 50 --nostream || true
